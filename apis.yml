aid: recycleye
name: Recycleye
description: >-
  Recycleye is a London-based company building AI-powered sorting equipment and
  analytics for waste management and material recovery businesses worldwide. Its
  products include Recycleye QualiBot robotic sorting cells, Recycleye QuantiSort
  optical sorting technology, and Recycleye Insights, a data analytics platform
  that uses computer vision (WasteNet) to identify and categorize waste streams.
  The company sells hardware and software into recycling operations to improve
  purity, recovery rates, and profitability. It was surfaced as a portfolio
  company of DCVC. As of this enrichment pass Recycleye publishes no public API,
  developer portal, or SDK; this profile captures its identity and public web
  properties only.
